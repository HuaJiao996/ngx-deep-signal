name: PR Requirements

# This workflow enforces that PRs are ready for review
# and sets up labels automatically

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  label-pr:
    name: Label PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Label as pending review
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          not-associated-label: 'status:pending'