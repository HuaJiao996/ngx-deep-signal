name: PR Requirements

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  label-pr:
    name: Label PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Add labels
        run: |
          echo "Review required: ${{ github.event.pull_request.title }}"
          # Add 'status/pending-review' label via GitHub CLI or API
          gh pr edit ${{ github.event.number }} --add-label "status:pending-review" 2>/dev/null || true